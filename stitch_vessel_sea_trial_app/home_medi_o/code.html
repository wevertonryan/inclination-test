<!-- Interactive Telemetry Emulation for Field Fidelity -->
<script>
    (function initMarineInclinometer() {
      const trimElem = document.getElementById('trim-val-display');
      const rollElem = document.getElementById('roll-val-display');
      const rollDisc = document.getElementById('roll-disc-svg');
      const trimRack = document.getElementById('trim-slider-rack');
      const recBtn = document.getElementById('rec-action-button');
      const recDot = document.getElementById('rec-dot-icon');
      
      let baseTrim = 1.4;
      let baseRoll = -0.8;
      let isRecording = false;

      // Realistic Micro-Buoyancy Wave Motion Simulation (Per-Frame Subtle Swell)
      let t = 0;
      function renderSwell() {
        t += 0.04;
        const waveTrimDelta = Math.sin(t) * 0.18 + Math.cos(t * 0.6) * 0.08;
        const waveRollDelta = Math.cos(t * 0.9) * 0.22 + Math.sin(t * 0.4) * 0.12;

        const liveTrim = (baseTrim + waveTrimDelta).toFixed(1);
        const liveRoll = (baseRoll + waveRollDelta).toFixed(1);

        if (trimElem) trimElem.textContent = (liveTrim >= 0 ? '+' : '') + liveTrim;
        if (rollElem) rollElem.textContent = (liveRoll >= 0 ? '+' : '') + liveRoll;

        // Displace Trim Vertical Axis (Approx 4.5px per degree)
        if (trimRack) {
          const displacementY = -1 * (parseFloat(liveTrim) * 5.2);
          trimRack.style.transform = `translateY(${displacementY}px)`;
        }

        // Rotate Roll Dial Angularly
        if (rollDisc) {
          const rotationAngle = parseFloat(liveRoll) * 1.8;
          rollDisc.style.transform = `rotate(${rotationAngle}deg)`;
        }

        requestAnimationFrame(renderSwell);
      }
      requestAnimationFrame(renderSwell);

      // Recording State Micro-Interaction
      if (recBtn && recDot) {
        recBtn.addEventListener('click', () => {
          isRecording = !isRecording;
          if (isRecording) {
            recDot.className = "w-5 h-5 rounded-sm bg-primary shadow-[0_0_14px_rgba(72,239,239,0.9)] transition-all";
            recDot.innerHTML = "";
          } else {
            recDot.className = "w-7 h-7 rounded-full bg-error shadow-[0_0_12px_rgba(255,180,171,0.9)] transition-all";
            recDot.innerHTML = "";
          }
        });
      }

      // Ensure Navigation Bar Item 0 (Home/Medição) has Active Styling
      try {
        const homeNav = document.querySelector('nav a[data-path="home-medicao"]');
        if (homeNav) {
          homeNav.classList.remove('text-on-surface-variant');
          homeNav.classList.add('text-primary');
        }
      } catch (e) {}
    })();
  </script>
