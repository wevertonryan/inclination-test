name: APK

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  apk:
    name: APK (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Compilar APK (Debug, assinado com debug keystore)
        run: >
          dotnet build InclinationTest.App/InclinationTest.App.csproj
          -f net10.0-android -c Debug
          -p:AndroidPackageFormat=apk
          -p:EmbedAssembliesIntoApk=true
          -p:AndroidFastDeploymentType=None

      - uses: actions/upload-artifact@v4
        with:
          name: inclination-test-apk
          path: src/InclinationTest.App/bin/Debug/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
          retention-days: 30
