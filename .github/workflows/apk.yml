name: APK

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (Android, Release + AOT)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Preparar chave de assinatura (opcional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 não configurado: usando a debug keystore efêmera do runner. Atualizar o app exigirá desinstalar a versão anterior."
          fi

      - name: Publicar APK (Release + AOT, arm64)
        env:
          KEYSTORE_CONFIGURED: ${{ steps.keystore.outputs.configured }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$KEYSTORE_CONFIGURED" = "true" ]; then
            export AndroidKeyStore=true
            export AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
            export AndroidSigningKeyAlias=inclination
            export AndroidSigningKeyPass="$KEYSTORE_PASSWORD"
            export AndroidSigningStorePass="$KEYSTORE_PASSWORD"
          fi

          dotnet publish InclinationTest.App/InclinationTest.App.csproj \
            -f net10.0-android \
            -c Release \
            -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:EmbedAssembliesIntoApk=true \
            -p:RunAOTCompilation=true \
            -p:AndroidEnableProfiledAot=true \
            -p:AndroidLinkMode=SdkOnly

      - uses: actions/upload-artifact@v4
        with:
          name: inclination-test-apk
          path: src/InclinationTest.App/bin/Release/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
          retention-days: 30
