name: Testes

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/test.yml'

jobs:
  jest:
    name: Jest + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
